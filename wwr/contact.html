<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us White Water Rafting</title>
    <meta name="description" content="In this page you'll able to see our many locations, set tour appointments, and call assistance.">
    <meta name="author" content="John Agramonte">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/new-rafting-logo.png" alt="White Water Rafting company logo featuring stylized text in blue and white with flowing water wave design elements">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="hero"> 
            <img src="images/wwr-background.jpg" alt="Multiple rafters in a boat paddling intensely through whitewater rapids, with splashing water and rocky river terrain, conveying excitement and adventure">
            <h1>White Water Rafting</h1>
        </div>
            <section>
                <h2>Contact Us</h2>
                <p>We would love to hear from you!</p>
                <p>Phone: (123) 456-7890</p>
                <p>Email: whitewaterrafting@wwr.org</p>
                <p>Address: 3702 E Provo Canyon Rd, Provo, UT 84604</p>
            </section>
            <section>
                <h2>Our Location</h2>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3040.3621695237844!2d-111.57139339999999!3d40.35649319999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x874d8dd88181d7b1%3A0xb791b1adc3ff9f6b!2sHigh%20Country%20Adventure!5e0!3m2!1sen!2sus!4v1785381497151!5m2!1sen!2sus" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
           </section>
           <section>
            <h2>Send Us a Message</h2>
            <form>
                <div>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div>
                    <label for="reservation">Reservation</label>
                    <input type="radio" id="reservation" name="purpose">
                </div>
                <div>
                    <label for="suggestions">Website Suggestions:</label>
                    <input type="radio" id="suggestions" name="purpose">
                </div>
                <div>
                    <label for="general">General Inquiry:</label>
                    <input type="radio" id="general" name="purpose">
                </div>
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <div>
                    <label for="updates">Would you like to receive updates?</label>
                    <input type="checkbox" id="updates" name="updates">
                </div>
                <button type="submit">Send Contact info</button>
            </form>
           </section>
           <section class="team">
            <h2>Meet Our Team</h2>
            <figure><img src="images/samira-silva.jpg" alt="A smiling woman with long blond dreadlocks">
            <figcaption>Samira Silva - Lead Rafting Instructor</figcaption>
        </figure>
            <figure><img src="images/jane-doe.jpg" alt="A smiling woman with sunglasses">
            <figcaption>Jane Doe - Assistant Rafting Instructor</figcaption>
        </figure>
            <figure><img src="images/jack-gilmore.jpg" alt="A smiling man rafting in a river">
            <figcaption>Jack Gilmore - Rafting Guide</figcaption>
        </figure>
           </section>
    </main>
    <footer>
        <p>©️2026 🥥 White Water Rafting 🥥 John Agramonte</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook logo">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram logo">
            </a>
            <a href="https://tiktok.com">
                <img src="images/tiktok.png" alt="TikTok logo">
            </a>
        </nav>
    </footer>
</body>

</html>
